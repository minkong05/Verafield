[project]
name = "tapak"
version = "0.1.0"
description = "TAPAK backend — EUDR evidence-preparation API for oil palm smallholders"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "packages/shared_types"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "shared_types"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern relies on calling Depends(...) as an
# argument default; without this, every route triggers a B008 false positive.
extend-immutable-calls = ["fastapi.Depends"]
